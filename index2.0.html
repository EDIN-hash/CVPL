<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bohdan Shvets - Projekt & Portfolio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc;
        }
        .folder-content {
            transition: max-height 0.3s ease-in-out;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Hub (CV Wrapper) -->
    <header class="no-print bg-slate-800 border-b border-slate-700 py-4 px-6 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    <i class="fas fa-id-card text-sky-400"></i> Bohdan Shvets — Portfolio & Projekty
                </h1>
                <p class="text-xs text-slate-400">Wybierz wersję stanowiska / Select target position:</p>
            </div>
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="switchTab('hr')" id="btn-hr" class="px-4 py-2 text-xs font-semibold rounded-lg bg-sky-600 text-white transition hover:bg-sky-500 shadow">
                    <i class="fas fa-users mr-1.5"></i> Junior HR Operations
                </button>
                <button onclick="switchTab('it')" id="btn-it" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 text-slate-200 transition hover:bg-slate-600 shadow">
                    <i class="fas fa-microchip mr-1.5"></i> IT Support Specialist
                </button>
                <button onclick="switchTab('office')" id="btn-office" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 text-slate-200 transition hover:bg-slate-600 shadow">
                    <i class="fas fa-building mr-1.5"></i> Office Manager
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto w-full p-6 my-auto">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold flex items-center gap-3">
                    <i class="fas fa-folder-open text-sky-400"></i> Файлы проекта
                </h2>
                <span id="repo-badge" class="text-xs bg-slate-700 text-sky-300 px-3 py-1 rounded-full font-mono">Загрузка...</span>
            </div>
            <p class="text-slate-400 text-sm mb-6">Структура репозитория с поддержкой папок и быстрого просмотра.</p>
            
            <div id="loader" class="text-center py-12 text-slate-400">
                <i class="fas fa-spinner fa-spin text-3xl mb-2 text-sky-400"></i>
                <p>Загрузка структуры проекта с GitHub...</p>
            </div>

            <!-- Древовидный список файлов -->
            <div id="file-tree" class="space-y-2 hidden"></div>
        </div>
    </main>

    <!-- Modal Viewer for Files -->
    <div id="file-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-4xl h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-slate-900 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
                <h3 id="modal-title" class="font-semibold text-slate-200 truncate flex items-center gap-2">
                    <i class="fas fa-file text-sky-400"></i> <span id="modal-filename">filename</span>
                </h3>
                <div class="flex items-center gap-3">
                    <a id="modal-raw-link" href="#" target="_blank" class="text-xs bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded font-semibold transition flex items-center gap-1">
                        <i class="fas fa-external-link-alt"></i> Открыть в новой вкладке
                    </a>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg px-2">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 bg-slate-950 p-4 overflow-auto flex items-center justify-center">
                <iframe id="modal-iframe" class="w-full h-full rounded border border-slate-800 bg-white" src=""></iframe>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center py-4 text-xs text-slate-500">
        Bohdan Shvets &bull; GitHub Project Explorer
    </footer>

    <script>
        // Управление переключением вкладок (заглушка под твой функционал CV)
        function switchTab(role) {
            ['hr', 'it', 'office'].forEach(r => {
                const btn = document.getElementById(`btn-${r}`);
                if (r === role) {
                    btn.className = "px-4 py-2 text-xs font-semibold rounded-lg bg-sky-600 text-white transition hover:bg-sky-500 shadow";
                } else {
                    btn.className = "px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 text-slate-200 transition hover:bg-slate-600 shadow";
                }
            });
            // Здесь можно будет переключать контент самого CV, если он находится на этой же странице
        }

        // Определение репозитория
        const hostname = window.location.hostname;
        const pathArray = window.location.pathname.split('/');
        const username = hostname.split('.')[0];
        const repo = pathArray.length > 1 && pathArray[1] !== '' ? pathArray[1] : '';

        document.getElementById('repo-badge').textContent = repo || `${username}.github.io`;

        async function fetchRepoFiles() {
            const treeEl = document.getElementById('file-tree');
            const loaderEl = document.getElementById('loader');

            try {
                let apiUrl = `https://api.github.com/repos/${username}/${repo}/git/trees/HEAD?recursive=1`;
                if (!repo || hostname.includes('github.io') && pathArray.length <= 2) {
                    apiUrl = `https://api.github.com/repos/${username}/${username}.github.io/git/trees/HEAD?recursive=1`;
                }

                let response = await fetch(apiUrl);
                if (!response.ok) throw new Error("API limit or repo not found");

                const data = await response.json();
                loaderEl.style.display = 'none';
                treeEl.classList.remove('hidden');

                const items = data.tree.filter(item => item.path !== 'index.html');

                if (items.length === 0) {
                    treeEl.innerHTML = '<p class="text-slate-500 text-center py-4">Файлов не найдено.</p>';
                    return;
                }

                // Строим дерево папок и файлов
                renderTree(items, treeEl);

            } catch (error) {
                loaderEl.innerHTML = `
                    <p class="text-red-400 mb-2"><i class="fas fa-exclamation-triangle"></i> Не удалось загрузить через API GitHub.</p>
                    <p class="text-xs text-slate-500">Убедись, что репозиторий публичный.</p>
                `;
            }
        }

        function renderTree(items, container) {
            // Простейшая группировка по папкам
            const root = { name: '', files: [], folders: {} };

            items.forEach(item => {
                const parts = item.path.split('/');
                let curr = root;
                
                parts.forEach((part, index) => {
                    if (index === parts.length - 1 && item.type === 'blob') {
                        curr.files.push({ name: part, path: item.path });
                    } else {
                        if (!curr.folders[part]) {
                            curr.folders[part] = { name: part, files: [], folders: {} };
                        }
                        curr = curr.folders[part];
                    }
                });
            });

            function buildHtml(node) {
                let html = '<div class="space-y-2">';
                
                // Рендерим папки
                for (let folderName in node.folders) {
                    const folder = node.folders[folderName];
                    html`
                        <div class="border border-slate-700/60 rounded-lg bg-slate-900/40 overflow-hidden">
                            <button onclick="toggleFolder(this)" class="w-full px-4 py-3 flex items-center justify-between bg-slate-900/80 hover:bg-slate-700/50 transition">
                                <span class="flex items-center gap-2 font-medium text-slate-300 text-sm">
                                    <i class="fas fa-folder text-amber-400"></i> ${folderName}
                                </span>
                                <i class="fas fa-chevron-down text-xs text-slate-400 transition-transform"></i>
                            </button>
                            <div class="folder-content p-3 border-t border-slate-800 bg-slate-950/40 space-y-2">
                                ${buildHtml(folder)}
                            </div>
                        </div>
                    `;
                }

                // Рендерим файлы
                node.files.forEach(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    let icon = 'fa-file text-slate-400';
                    if(['html', 'htm'].includes(ext)) icon = 'fa-file-code text-orange-400';
                    else if(['css', 'js'].includes(ext)) icon = 'fa-file-lines text-yellow-400';
                    else if(['png', 'jpg', 'jpeg', 'svg', 'ico'].includes(ext)) icon = 'fa-file-image text-emerald-400';
                    else if(['pdf', 'txt', 'md'].includes(ext)) icon = 'fa-file-lines text-sky-400';

                    html += `
                        <div class="bg-slate-900/60 border border-slate-700/60 rounded-lg p-2.5 px-4 flex items-center justify-between hover:border-sky-500 transition-all">
                            <div class="flex items-center gap-3 truncate">
                                <i class="fas ${icon} text-lg w-6 text-center"></i>
                                <span class="text-sm font-medium text-slate-200 truncate">${file.name}</span>
                            </div>
                            <button onclick="openFile('${file.path}', '${file.name}')" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded font-semibold transition shrink-0 ml-4 flex items-center gap-1.5">
                                <i class="fas fa-eye"></i> Просмотр
                            </button>
                        </div>
                    `;
                });

                html += '</div>';
                return html;
            }

            container.innerHTML = buildHtml(root);
        }

        function toggleFolder(btn) {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('.fa-chevron-down');
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function openFile(path, name) {
            document.getElementById('modal-filename').textContent = name;
            document.getElementById('modal-iframe').src = path;
            document.getElementById('modal-raw-link').href = path;
            document.getElementById('file-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('file-modal').classList.add('hidden');
            document.getElementById('modal-iframe').src = '';
        }

        fetchRepoFiles();
    </script>
</body>
</html>
